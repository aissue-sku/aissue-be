name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GIT_ACTION_TOKEN }}
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all JARs
        run: ./gradlew build -x test --no-daemon

      - name: Docker Hub Login
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push each service image
        run: |
          SERVICES="eureka-server config-server gateway auth-service user-service content-collection-service notification-service ai-service"

          for SERVICE in $SERVICES; do
            echo "🔵 Building image for: $SERVICE"

            JAR=$(find "${SERVICE}/build/libs" -name "*.jar" ! -name "*plain*" -type f | head -1)
            if [ -z "$JAR" ]; then
              echo "❌ JAR not found for $SERVICE"
              exit 1
            fi

            cp "$JAR" docker/app.jar
            docker build -f docker/Dockerfile.ci \
              -t ${{ secrets.DOCKER_USERNAME }}/aissue-${SERVICE}:latest \
              -t ${{ secrets.DOCKER_USERNAME }}/aissue-${SERVICE}:${{ github.sha }} \
              docker/
            rm docker/app.jar

            docker push ${{ secrets.DOCKER_USERNAME }}/aissue-${SERVICE}:latest
            docker push ${{ secrets.DOCKER_USERNAME }}/aissue-${SERVICE}:${{ github.sha }}

            echo "✅ $SERVICE pushed"
          done

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Copy compose files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker/docker-compose.yml,docker/docker-compose-prod.yml,docker/mysql/init.sh,docker/prometheus/prometheus.yml,docker/grafana/provisioning/datasources/prometheus.yml,docker/grafana/provisioning/dashboards/provider.yml"
          target: "~/app"

      - name: Deploy on production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/app/docker

            echo "🔵 [PROD] .env 생성 중..."
            printf "${{ secrets.PROD_ENV_FILE }}" > .env

            chmod +x mysql/init.sh

            echo "🔵 [PROD] Docker Hub 로그인..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "🔵 [PROD] 최신 이미지 pull..."
            docker compose -f docker-compose.yml -f docker-compose-prod.yml pull

            MYSQL_STATUS=$(docker inspect -f '{{.State.Status}}' mysql 2>/dev/null || echo "not_found")

            if [ "$MYSQL_STATUS" = "running" ]; then
              echo "🟡 [PROD] 인프라 유지 → Spring 서비스 재기동 (depends_on 순서 보장)"
              docker compose -f docker-compose.yml -f docker-compose-prod.yml up -d \
                config-server eureka-server gateway auth-service user-service content-collection-service notification-service ai-service
            else
              echo "🟢 [PROD] 전체 스택 기동"
              docker compose -f docker-compose.yml -f docker-compose-prod.yml up -d
            fi

            echo "🔵 [PROD] 사용하지 않는 이미지 정리"
            docker image prune -f

            echo "✅ [PROD] 배포 완료!"
